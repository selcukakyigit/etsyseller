<!doctype html>
<html lang="{{ lang|default('en') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#F4F0EA;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader|default('') }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F0EA;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
      <tr><td style="padding:0 4px 20px;">
        <a href="{{ site_url }}"><img src="{{ wordmark_url }}" alt="{{ brand }}" height="28" style="display:block;height:28px;width:auto;border:0;"></a>
      </td></tr>
      <tr><td style="background:#FFFFFF;border-radius:16px;padding:32px 28px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#2B2620;">
        {% block content %}{% endblock %}
      </td></tr>
      <tr><td style="padding:20px 4px 0;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#8A8278;">
        {% block footer %}{% endblock %}
        <p style="margin:0 0 6px;">{{ company.name }}<br>{{ company.address }}</p>
        <p style="margin:0 0 6px;">
          <a href="{{ site_url }}/terms" style="color:#8A8278;">Terms</a> &middot;
          <a href="{{ site_url }}/privacy" style="color:#8A8278;">Privacy</a> &middot;
          <a href="{{ site_url }}/contact" style="color:#8A8278;">Contact</a>
        </p>
        <p style="margin:0;">{{ etsy_disclaimer }}</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
